baseURL = 'https://dwdyy.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'Dongwei Wang'
theme = 'austere'
copyright = '© 2026 Dongwei Wang'
enableRobotsTXT = true
timeZone = 'Asia/Hong_Kong'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  description = ''
  author = 'Dongwei Wang'
  keywords = '计算机科学, 编程, 算法, 系统, 数学, Hugo'
  strapline = ''
  footerText = '© 2026 Dongwei Wang · Built with Hugo and the Austere theme'
  favicon = '/images/github-avatar.png'
  profilePicture = '/images/github-avatar.png'
  siteIcon = '/images/github-avatar.png'
  undatedPosition = 'below'

[menus]
  [[menus.main]]
    name = '首页'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = '文章'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = '标签'
    pageRef = '/tags'
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'

