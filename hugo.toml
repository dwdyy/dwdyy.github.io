baseURL = 'https://dwdyy.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'Dongwei Wang'
theme = 'minimal-light'
copyright = '© 2026 Dongwei Wang'
enableRobotsTXT = true
timeZone = 'Asia/Hong_Kong'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  description = '王东威，电子科技大学软件工程本科生。关注智能体、强化学习与大模型。'
  author = 'Dongwei Wang'
  keywords = '计算机科学, 编程, 算法, 系统, 数学, Hugo'
  strapline = ''
  footerText = '© 2026 Dongwei Wang'
  undatedPosition = 'below'

[menus]
  [[menus.main]]
    name = '关于我'
    url = '/#about'
    weight = 10
  [[menus.main]]
    name = '教育背景'
    url = '/#education'
    weight = 20
  [[menus.main]]
    name = '研究经历'
    url = '/#research'
    weight = 25
  [[menus.main]]
    name = '奖项与荣誉'
    url = '/#honors'
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'

